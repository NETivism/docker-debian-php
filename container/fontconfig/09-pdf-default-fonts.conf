<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Default font for wkhtmltopdf (Helvetica, also used when a CSS font is missing):
       Liberation Sans for Latin, Droid Sans Fallback for CJK.
       Strong binding overrides urw (Nimbus Sans) on bullseye and WenQuanYi on trixie. -->
  <match target="pattern">
    <test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Liberation Sans</string>
      <string>Droid Sans Fallback</string>
    </edit>
  </match>
  <!-- For any other font (e.g. DejaVu Sans), CJK still falls back to Droid,
       not WenQuanYi or Noto CJK JP (Japanese glyphs). -->
  <match target="pattern">
    <edit name="family" mode="append" binding="strong"><string>Droid Sans Fallback</string></edit>
  </match>
</fontconfig>
